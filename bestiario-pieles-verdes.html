<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · Pieles Verdes</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.actions article{padding:12px;margin:8px 0;background:#11170d;border-left:3px solid #587b32}.actions b{color:#a8c779}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#11150d;border:1px solid #3f512b;line-height:1.5}.enemy-title{text-align:center}.equipment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.equipment-grid ul{margin:.5em 0;padding-left:1.25em}@media(max-width:620px){.equipment-grid{grid-template-columns:1fr}}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">PIELES VERDES · ORCOS Y GOBLINS</p></header><main><section id="list"><a href="bestiario.html?v=7" style="text-decoration:none"><button>← VOLVER A FACCIONES</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>Pieles Verdes</h2><p>Tribus orcas y goblins. Pulsa sobre un enemigo para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A PIELES VERDES</button><div id="content"></div></section></main></div><script>const E={
'Orco Bruto':{img:'assets/orco-bruto-ficha.png',sub:'Guerrero de las Tribus Orcas',s:{M:4,HA:4,HP:2,F:4,R:4,H:2,I:2,A:2,L:6},save:'5+',use:['Grandes hachas.','Armas de mano.','Armaduras ligeras y de piel.','Escudos.','Lanzas toscas.'],no:['Armas a distancia.','Armaduras pesadas.','Armaduras de placa.','Armas de fuego ni pólvora.'],rules:['Deztroza Todo lo Veaz: contra estructuras de escenografía, obtiene +1 a la Fuerza.','Piel Dura: anula la primera herida que reciba (1 vez por partida).'],a:[['1-2','¡A la Carga!','Carga si puede y obtiene +2 a la Fuerza (solo si cargaste). Si ya estás en combate, ataca con normalidad.'],['3-4','Golpe Brutal','Carga al enemigo más cercano. Si ya estás en combate, tus ataques dañan a todo objetivo adyacente.'],['5-6','Furia Orca','Se mueve hasta 4 casillas hacia el enemigo más cercano. Realiza un ataque cuerpo a cuerpo. Si tiene al menos 1 aliado orco o goblin adyacente, obtiene +1 al impactar.']]},
'Krazgur el Desollador':{img:'assets/Krazgur.png',sub:'Jefe de Guerra Orco',s:{M:6,HA:4,HP:3,F:5,R:4,H:3,I:3,A:4,L:8},save:'5+',use:['Dos rebanadoras.','Armas de gran tamaño.','Armas arrojadizas simples (jabalinas, hachas).','Armaduras pesadas y de piel.','Escudos.'],no:['Armas a una mano (salvo las rebanadoras).','Armas de fuego ni pólvora.','Armaduras de placa.','Objetos mágicos complejos.'],rules:['Jefe de Guerra (pasiva): los aliados orcos a 4 casillas obtienen +1 al Liderazgo. Puedes repetir una tirada de Liderazgo fallida (1 vez por partida).','Destrucción Brutal (pasiva): contra estructuras de escenografía, obtiene +2 a la Fuerza. Si derriba una estructura, puede mover hasta 4 casillas y realizar 2 ataques (1 vez por partida).'],a:[['1-2','Tormenta de Cuchillas','Realiza 4 ataques con sus dos rebanadoras. Si impacta, cada ataque sólo puede dirigirse a un objetivo adyacente, aunque estén en combate con otros aliados.'],['3-4','Carga Brutal','Carga al enemigo más cercano y realiza 4 ataques. Si ya estás en combate, puedes realizar los 4 ataques con normalidad (a los objetivos adyacentes).'],['5-6','Arrebatar y Matar','Realiza 4 ataques. Si eliminas a un enemigo en este turno, puedes mover hasta 4 casillas hacia otro enemigo más cercano y realizar 2 ataques adicionales.']]}
};const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n],stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>',equip='<div class="equipment-grid"><div class="enemy-note"><b>✓ PUEDE USAR</b><ul>'+d.use.map(x=>'<li>'+x+'</li>').join('')+'</ul></div><div class="enemy-note"><b>✕ NO PUEDE USAR</b><ul>'+d.no.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></div>';L.hidden=true;S.hidden=false;const ficha=d.img?'<div style="margin:0 auto 18px;max-width:100%"><img src="'+d.img+'" alt="Ficha de '+n+'" style="display:block;width:100%;height:auto;border-radius:10px"></div>':'';C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2 class="enemy-title">'+n+'</h2><p class="hero-subtitle" style="text-align:center">'+d.sub+'</p>'+ficha+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><h3>HABILIDADES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div><h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div><h3>EQUIPO QUE PUEDE EMPLEAR</h3>'+equip;scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
