<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · Bestias del Caos</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.actions article{padding:12px;margin:8px 0;background:#17110d;border-left:3px solid #7b2c20}.actions b{color:#d09a72}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#15100c;border:1px solid #493723;line-height:1.5}.enemy-title{text-align:center}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">BESTIAS DEL CAOS</p></header><main><section id="list"><a href="bestiario.html?v=4" style="text-decoration:none"><button>← VOLVER A FACCIONES</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>Bestias del Caos</h2><p>Consulta rápida para la mesa. Pulsa sobre una criatura para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A BESTIAS DEL CAOS</button><div id="content"></div></section></main></div><script>const E={
'Clakakr':{sub:'Bestia voladora del Caos',s:{M:6,HA:3,HP:2,F:3,R:3,H:1,I:5,A:2},save:'5+',eq:'Garras afiladas y aguijón natural.',rules:['Vuelo: puede sobrevolar obstáculos y unidades.','Enjambre: +1 a impactar si hay otro Clakakr adyacente.'],a:[['1/2','Ataque rápido','Mueve y ataca al héroe más cercano.'],['3/4/5','Garra, Garra, Bocao','Ataca si puede. Realiza dos garrazos y, si ambos aciertan, realiza un ataque extra de Bocao.'],['6','Grito perforante','Todos los héroes hasta 4 casillas realizan un chequeo de Liderazgo o sufren una herida.']]},
'Garra Pico':{sub:'Líder Clakakr · Señor Volador del Caos y Pirata del Aire',s:{M:6,HA:4,HP:3,F:4,R:4,H:3,I:2,A:6,L:3},save:'4+',eq:'Dos cimitarras rúnicas del caos, pañuelo pirata (armadura ligera) y aguijón natural.',rules:['Vuelo: puede sobrevolar obstáculos y unidades.','Comandante de Enjambre: +2 a impactar si hay otro Clakakr a 6 casillas.','Parada con Cimitarras: si no ataca, gana +1 Salvación contra ataques cuerpo a cuerpo.'],a:[['1/2','Carga Asoladora','Mueve al héroe más lejano y realiza un Ataque Rápido con F+1. Si impacta, realiza un ataque de Pisotón adicional con F3.'],['3/4/5','Corte y Tajo','Realiza tres garrazos de cimitarras (F+1). Si al menos dos impactan, realiza un ataque extra de Bocao.'],['6','Grito de Batalla','Todos los héroes hasta 6 casillas realizan un chequeo de Liderazgo con -1 o sufren una herida. El Jefe gana +1A hasta su siguiente turno.']]},
'Estatua Animada':{sub:'Constructo · Guardián mágico',s:{M:3,HA:4,HP:0,F:5,R:5,H:5,I:1,A:2,L:10},save:'4+',eq:'Puños de piedra: ataques cuerpo a cuerpo de F5. Cuerpo de piedra: Salvación 4+.',rules:['Constructo sin alma: inmune a miedo, veneno, sangrado, control mental y moral.','Lenta pero imparable: no puede correr; ignora terreno difícil.','Golpe demoledor: con un 6 natural para herir causa 1 herida adicional.','Piel de piedra: las armas normales sufren -1F al herirla; las mágicas, martillos y armas a dos manos ignoran esta penalización.','Pistón de piedra: una vez cada 2 turnos, todos los héroes adyacentes sufren un Impacto F4.'],a:[['1','Puños de piedra','Ataca cuerpo a cuerpo al héroe más cercano.'],['2','Avance imparable','Se mueve su movimiento máximo hacia el héroe más cercano. Si llega a combate, ataca con Puños de piedra.'],['3','Pistón de piedra','Si ya está en combate, realiza un Pistón de piedra. Si no, se mueve hacia el héroe más cercano y, si llega a combate, lo realiza al final de su movimiento.'],['4','Piel de piedra','Gana +1 a su Salvación hasta su próximo turno.'],['5','Mirada pétrea','Todos los héroes a 6 casillas deben superar una tirada de Liderazgo. Si fallan, no pueden correr ni usar habilidades que otorguen movimiento adicional hasta su próximo turno.'],['6','Terremoto','Todos los objetivos hasta 4 casillas de la Estatua Animada reciben un Impacto de Fuerza 4; si logra herir, ese objetivo no podrá hacer acciones en su siguiente turno.']],loot:'1-2: Fragmentos sin valor · 3-4: Núcleo arcano agrietado, 1D6 × 5 coronas · 5: Runa menor intacta, 15 coronas · 6: Fragmento mágico, 25 coronas'}
};const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n],stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>',loot=d.loot?'<div class="enemy-note"><b>RECOMPENSA · D66</b><p>'+d.loot+'</p></div>':'';L.hidden=true;S.hidden=false;C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2 class="enemy-title">'+n+'</h2><p class="hero-subtitle" style="text-align:center">'+d.sub+'</p>'+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><div class="enemy-note"><b>EQUIPO</b><p>'+d.eq+'</p></div><h3>REGLAS ESPECIALES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div><h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div>'+loot;scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
