name: Añadir Enanos a Héroes
on:
  push:
    paths:
      - '.github/workflows/add-dwarfs-heroes.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Añadir Enanos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('heroes.html')
          s=p.read_text()
          s=s.replace('<button class="locked">ENANOS</button>','<button onclick="showFaction(\'enanos\')">ENANOS</button>')
          marker='<section id="leonce" class="sheet">'
          faction='''<section id="enanos" class="faction-section"><h2>⚒ Enanos</h2><div class="hero-list"><button class="hero-card" onclick="openHero('thorgar','enanos')"><h3>Thorgar Hierroengranaje</h3><small>Maestro Artificiero</small></button><button class="hero-card" onclick="openHero('durgrom','enanos')"><h3>Durgrom Rompehierros</h3><small>Guerrero Acorazado de las Fortalezas Enanas</small></button><button class="hero-card" onclick="openHero('helka','enanos')"><h3>Helka Mano Sangrienta</h3><small>Matadora Enana</small></button></div></section>'''
          if 'id="enanos"' not in s:
              s=s.replace(marker,faction+marker)
          sheet_marker='</main><script>'
          sheets='''<section id="thorgar" class="sheet"><button onclick="back()">← VOLVER A ENANOS</button><h2>Thorgar Hierroengranaje</h2><p>Maestro Artificiero</p><div class="stats-grid"><div><small>MOV</small><b>3</b></div><div><small>HA</small><b>3</b></div><div><small>HP</small><b>5</b></div><div><small>FUE</small><b>3</b></div><div><small>RES</small><b>4</b></div><div><small>HER</small><b>2</b></div><div><small>ATQ</small><b>2</b></div><div><small>IN</small><b>2</b></div><div><small>LID</small><b>9</b></div></div><p class="save">Salvación 6+</p><h3>Maestro Artificiero</h3><p>Al comienzo de cada misión elige uno de estos inventos; su efecto dura toda la misión.</p><div class="oaths"><div class="oath"><b>Visor de Precisión</b><p>Tus ataques a distancia obtienen +1 al impactar.</p></div><div class="oath"><b>Balas Perforantes</b><p>Tu arma de proyectil obtiene +1 Fuerza.</p></div><div class="oath"><b>Cargador Automático</b><p>Una vez por turno puedes repetir una tirada para impactar fallida con un arma de proyectil.</p></div><div class="oath"><b>Granada de Vapor</b><p>Una vez por partida elige una casilla a 6 casillas. Todas las miniaturas adyacentes sufren 1 impacto de Fuerza 3 e ignoran armadura ligera.</p></div></div><div class="rule"><b>Tirador Legendario</b><p>Con un 6 natural para impactar con un arma de proyectil, el ataque obtiene Golpe Demoledor (+1 herida) o ignora completamente la salvación por armadura del objetivo.</p></div><div class="rule"><b>Maestro Rúnico e Ingeniero · Pasiva</b><p>En la herrería puede modificar un arma o armadura por un 50% menos del coste habitual. Una vez por campaña puede grabar gratuitamente una runa menor en un objeto de un aliado.</p></div><div class="rule"><b>Odio a la Magia</b><p>Cuando un enemigo lance un hechizo a 6 casillas o menos, el lanzador debe superar un chequeo de Liderazgo. Si falla, sufre -1 a la tirada para lanzar ese hechizo.</p></div></section><section id="durgrom" class="sheet"><button onclick="back()">← VOLVER A ENANOS</button><h2>Durgrom Rompehierros</h2><p>Guerrero Acorazado de las Fortalezas Enanas</p><div class="stats-grid"><div><small>MOV</small><b>3</b></div><div><small>HA</small><b>5</b></div><div><small>HP</small><b>4</b></div><div><small>FUE</small><b>3</b></div><div><small>RES</small><b>4</b></div><div><small>HER</small><b>3</b></div><div><small>ATQ</small><b>2</b></div><div><small>IN</small><b>2</b></div><div><small>LID</small><b>10</b></div></div><p class="save">Salvación por armadura 3+ · Armadura completa de Gromril</p><h3>Juramento del Ancestro</h3><p>Antes de cada misión elige uno.</p><div class="oaths"><div class="oath"><b>Ancestro de la Fortaleza</b><p>Mientras permanezcas inmóvil obtienes +1 CA; aliados adyacentes +1 CA.</p></div><div class="oath"><b>Ancestro del Martillo</b><p>Mazas y martillos +1 al herir. Si hieres a un enemigo Grande o Jefe, queda Aturdido y obtiene -1 al impactar hasta su siguiente turno.</p></div><div class="oath"><b>Ancestro del Escudo</b><p>Mientras no te hayas movido este turno obtienes Salvación especial 5+.</p></div><div class="oath"><b>Ancestro de la Venganza</b><p>Contra Orcos, Goblins, No Muertos y Demonios +1 al impactar. Si eliminas a un enemigo puedes mover 1 casilla gratuitamente.</p></div></div><div class="rule"><b>Muro de Gromril · Pasiva</b><p>Si está adyacente a un aliado, ese aliado obtiene cobertura pesada frente a ataques a distancia y los enemigos no pueden atravesar ninguna casilla adyacente ocupada por Durgrom.</p></div><div class="rule"><b>¡No pasarán! · Una vez por partida</b><p>Hasta el comienzo de su siguiente turno no puede ser desplazado, obtiene +1 CA y los aliados adyacentes obtienen Resistencia a la magia 1.</p></div><div class="rule"><b>Rompe-corazas · Pasiva</b><p>Mientras uses una maza de una o dos manos, si hieres a tu oponente reduce en -1 su CA. No afecta a salvaciones mágicas ni regeneración.</p></div><div class="rule"><b>Rúnico Enano · Pasiva</b><p>Puede grabar una runa menor en una pieza de equipo durante cada visita a la herrería pagando su coste habitual.</p></div></section><section id="helka" class="sheet"><button onclick="back()">← VOLVER A ENANOS</button><h2>Helka Mano Sangrienta</h2><p>Matadora Enana</p><div class="stats-grid"><div><small>MOV</small><b>3</b></div><div><small>HA</small><b>5</b></div><div><small>HP</small><b>2</b></div><div><small>FUE</small><b>4</b></div><div><small>RES</small><b>4</b></div><div><small>HER</small><b>2</b></div><div><small>ATQ</small><b>3</b></div><div><small>IN</small><b>2</b></div><div><small>LID</small><b>10</b></div></div><p class="save">Sin armadura · Salvación especial 0+</p><h3>Juramento del Matador · Pasiva</h3><p>Antes de cada misión elige una presa: Monstruos, Jefes enemigos, Demonios, Dragones, No Muertos o el enemigo más Grande del escenario. Contra ella obtiene +1 al impactar y repite los 1 al herir. Si la mata, obtiene 2D6 coronas adicionales.</p><div class="rule"><b>Ira del Matador · Pasiva</b><p>Con 2 Heridas usa su perfil normal. Con 1 Herida restante obtiene +1 Ataque, +1 Fuerza, Penetración de Armadura 1 e inmunidad al Miedo y al Terror.</p></div><div class="rule"><b>¡Eso no ha sido más que un arañazo! · Una vez por partida</b><p>La primera vez que fuese a caer en combate permanece con 1 Herida y puede efectuar inmediatamente un ataque gratuito contra el enemigo que la haya herido.</p></div><div class="rule"><b>Muerte Gloriosa · Pasiva</b><p>Si muere matando al enemigo que juró derrotar, todos los héroes obtienen al final de la misión 25 coronas por héroe, un objeto mágico menor y una tirada adicional en la tabla de botín.</p></div><div class="rule"><b>Locura Matadora · Pasiva</b><p>Helka no puede retirarse voluntariamente de un combate cuerpo a cuerpo.</p></div></section>'''
          if 'id="thorgar"' not in s:
              s=s.replace(sheet_marker,sheets+sheet_marker)
          p.write_text(s)
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heroes.html
          git commit -m "Añadir héroes Enanos" || exit 0
          git push
