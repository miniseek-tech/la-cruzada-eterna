name: Enlazar Mision IV
on:
  push:
    paths:
      - '.github/workflows/link-mission4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlazar Mision IV
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="const completed1=campaign.completed.includes(1),completed2=campaign.completed.includes(2);"
          new="const completed1=campaign.completed.includes(1),completed2=campaign.completed.includes(2),completed3=campaign.completed.includes(3),completed4=campaign.completed.includes(4);"
          if old not in s:
              raise SystemExit('No se encontro bloque de progreso esperado')
          s=s.replace(old,new,1)
          old="document.getElementById('node2').classList.toggle('complete',completed2);"
          new="document.getElementById('node2').classList.toggle('complete',completed2);"
          if old not in s:
              raise SystemExit('No se encontro nodo II')
          # Hub: anteponer M4 cuando M3 esta completada.
          marker="if(completed2){hub.innerHTML="
          if marker not in s:
              raise SystemExit('No se encontro bloque M3')
          m4="if(completed3){hub.innerHTML='<small>MISIÓN III · COMPLETADA</small><h3>Los Patios de Kappelburg</h3><p>El camino hacia las profundidades de Kappelburg está abierto.</p><div class=\"divider\"><span>◆</span></div><small>MISIÓN IV · DISPONIBLE</small><h3>Las Criptas de la Sangre Negra</h3><p>Destruid los Tres Sellos de Sangre Negra antes de que el ritual concluya.</p><p><b>4 héroes</b></p><button class=\"hub-main-action\" onclick=\"location.href=&quot;mision4.html&quot;\">⚔ COMENZAR / CONTINUAR MISIÓN IV</button>'}else "
          s=s.replace(marker,m4+marker,1)
          # Eliminar metadato no confirmado que quedo en M3 si sigue presente.
          s=s.replace('<p><b>4 héroes · Nivel recomendado 3</b></p>','<p><b>4 héroes</b></p>')
          p.write_text(s)
          PY
      - name: Guardar cambio
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Enlazar Misión IV desde el campamento'
          git push
