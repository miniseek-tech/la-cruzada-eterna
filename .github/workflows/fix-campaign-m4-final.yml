name: Corregir campamento Mision IV final
on:
  push:
    paths:
      - '.github/workflows/fix-campaign-m4-final.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir progreso Mision IV
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const c=campaign;
              if(!c) return;
              const completed3=(c.completed||[]).includes(3)||Number(c.mission)>=4;"""
          new="""campaign=JSON.parse(localStorage.getItem('cruzadaCampaign')||'null');
              const c=campaign;
              if(!c) return;
              const m3=JSON.parse(localStorage.getItem('cruzadaMission3')||'null');
              const completed3=(c.completed||[]).includes(3)||Number(c.mission)>=4||(m3&&m3.resolved&&m3.victory);"""
          if new in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('No se encontro el hotfix actual')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar
        run: |
          grep -q "localStorage.getItem('cruzadaCampaign')" index.html
          grep -q "localStorage.getItem('cruzadaMission3')" index.html
          grep -q 'MISIÓN IV · DISPONIBLE' index.html
          grep -q 'mision4.html' index.html
      - name: Publicar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Leer progreso real y desbloquear Mision IV'
          git push
