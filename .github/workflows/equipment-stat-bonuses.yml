name: Bonificaciones de equipo en campaña
on:
  push:
    paths:
      - '.github/workflows/equipment-stat-bonuses.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar equipo de campaña
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('campamento-equipo.html')
          s=p.read_text(encoding='utf-8')

          old='.magic-count{font-size:.78rem;color:#bca8d8}.reward-box{'
          new='.magic-count{font-size:.78rem;color:#bca8d8}.bonus-summary{margin:9px 0;padding:9px;border:1px solid #5d4a31;border-radius:7px;background:rgba(40,31,20,.55)}.bonus-summary b{color:#e3c474}.bonus-chip{display:inline-block;margin:3px 4px 3px 0;padding:3px 7px;border:1px solid #765e35;border-radius:12px;font-size:.78rem}.effect-note{font-size:.78rem;opacity:.82;margin-top:5px}.reward-box{'
          if old not in s:
              raise SystemExit('No se encontró el CSS esperado')
          s=s.replace(old,new,1)

          anchor="function heroOptions(item){return campaign.heroes.map((h,hi)=>{const r=restrictionFor(h,item);return `<option value=\"${hi}\" ${r.ok?'':'disabled'}>${r.ok?'':'⛔ '}${esc(h.name)}${r.ok?'':' — '+esc(r.reason)}</option>`}).join('')}"
          insert="""function heroOptions(item){return campaign.heroes.map((h,hi)=>{const r=restrictionFor(h,item);return `<option value=\"${hi}\" ${r.ok?'':'disabled'}>${r.ok?'':'⛔ '}${esc(h.name)}${r.ok?'':' — '+esc(r.reason)}</option>`}).join('')}function equipmentBonusFor(item){const n=norm(item);const out={M:0,F:0,A:0,I:0,CA:0,SALV:0};if(n.includes('armadura ligera'))out.SALV+=1;if(n.includes('armadura pesada'))out.SALV+=2;if(n==='escudo')out.SALV+=1;if(n.includes('espada / gran hacha / martillo a dos manos'))out.F+=2;if(n.includes('espada veloz'))out.A+=1;if(n.includes('martillo runico'))out.F+=1;if(n.includes('capa del viaje eterno')){out.M+=1;out.I+=1}if(n.includes('hacha runica de chrace'))out.F+=2;if(n.includes('manto del rey leon'))out.CA+=2;if(n.includes('escudo de athel loren'))out.CA+=1;return out}function equipmentBonuses(hero){const total={M:0,F:0,A:0,I:0,CA:0,SALV:0};for(const it of hero.equipment){const b=equipmentBonusFor(it);for(const k of Object.keys(total))total[k]+=b[k]||0}return total}function bonusSummary(hero){const b=equipmentBonuses(hero);const labels={M:'M',F:'F',A:'A',I:'I',CA:'CA',SALV:'Salv.'};const chips=Object.entries(b).filter(([,v])=>v).map(([k,v])=>`<span class=\"bonus-chip\">${labels[k]} +${v}</span>`).join('');const effects=hero.equipment.map(it=>metaFor(it)).filter(Boolean).filter(m=>m.description&&!/^(\\+\\d+ (Ataque|Fuerza)\\.?|Armadura de cuero|Armadura de malla completa)/i.test(m.description)).map(m=>`<div class=\"effect-note\"><b>${esc(m.name)}:</b> ${esc(m.description)}</div>`).join('');return `<div class=\"bonus-summary\"><b>Bonificaciones activas de equipo</b><div>${chips||'<span class=\"empty\">Sin modificadores directos.</span>'}</div>${effects}</div>`}"""
          if anchor not in s:
              raise SystemExit('No se encontró heroOptions')
          s=s.replace(anchor,insert,1)

          oldrender="<div class=\"magic-count\">Objetos mágicos: ${magicCount(h)}/3</div>${h.equipment.length?"
          newrender="<div class=\"magic-count\">Objetos mágicos: ${magicCount(h)}/3</div>${bonusSummary(h)}${h.equipment.length?"
          if oldrender not in s:
              raise SystemExit('No se encontró el render de héroes esperado')
          s=s.replace(oldrender,newrender,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campamento-equipo.html
          git commit -m 'Mostrar bonificaciones activas del equipo' || exit 0
          git push
