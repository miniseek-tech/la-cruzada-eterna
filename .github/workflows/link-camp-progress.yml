name: Enlazar progreso de héroes
on:
  push:
    paths:
      - '.github/workflows/link-camp-progress.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir acceso a experiencia y niveles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="<button class=\"hub-main-action\" onclick=\"location.href='campamento-equipo.html'\">⚔ GESTIONAR EQUIPO E INVENTARIO</button>"
          new=old+"<button class=\"hub-main-action\" onclick=\"location.href='campamento-progreso.html'\">✦ EXPERIENCIA Y NIVELES</button>"
          if 'campamento-progreso.html' not in s:
              if old not in s:
                  raise SystemExit('No se encontró el botón de equipo del campamento')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Enlazar experiencia y niveles desde el campamento"
          git push
