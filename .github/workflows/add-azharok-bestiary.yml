name: Añadir Azharok al Bestiario
on:
  push:
    paths:
      - '.github/workflows/add-azharok-bestiary.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir Azharok
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bestiario-no-muertos.html')
          s=p.read_text(encoding='utf-8')
          if "'Azharok el Imperecedero':" in s:
              print('Azharok ya existe; no se modifica.')
              raise SystemExit
          marker='};const B='
          if marker not in s:
              raise SystemExit('No se encontró el cierre del bestiario')
          entry=""",\n'Azharok el Imperecedero':{sub:'Liche Supremo de la Nigromancia · Jefe de La Última Vigilia de Morr',s:{M:4,HA:4,HP:5,F:4,R:5,H:5,I:4,A:2,L:10},save:'4+ · Mágica 5+',eq:'Báculo de Cráneos, Túnica de Seda Espectral y El Cáliz de Sangre Negra (Artefacto).',rules:['Azharok el Imperecedero cuenta como 3 miniaturas.','Inmune a Psicología.','Todos los No Muertos a 8 casillas pueden repetir chequeos de Liderazgo.','Señor de la Muerte: al comienzo de cada turno del Maestro invoca 1D3 Esqueletos en casillas adyacentes.','No muerto: a partir del turno 6 el cuerpo del nigromante colapsa. Debe superar un chequeo de Liderazgo o sufrir 1 Herida sin posibilidad de salvación.','Experto en magia negra: obtiene 4 dados para lanzar por turno. Una vez por partida puede repetir dos dados lanzados ese mismo turno y debe aceptar el nuevo resultado.','Aura imperecedera: los No Muertos aliados a 6 casillas recuperan 1 Herida al inicio de cada uno de sus turnos, sin superar su máximo.'],a:[['1/2','Escudo de huesos','Lanza sobre sí mismo Escudo de Huesos. Hasta el comienzo de su próximo turno obtiene +2 a su Salvación.'],['3/4/5','Proyectil profano','Elige un héroe a 12 casillas o menos. Impacta automáticamente y causa 1D3 Heridas sin tirada de salvación.'],['6','Vórtice de almas','Crea un remolino de energía nigromántica a 6 casillas o menos. Todas las miniaturas, héroes y enemigos, en la zona sufren 1D3 Heridas sin tirada de salvación.']],loot:'5D6 Coronas'}\n"""
          s=s.replace(marker,entry+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bestiario-no-muertos.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Añadir Azharok al Bestiario de No Muertos"
          git push
