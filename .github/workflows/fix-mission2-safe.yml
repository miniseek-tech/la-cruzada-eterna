name: Fix mission 2 safe
on:
  push:
    paths:
      - '.github/workflows/fix-mission2-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Mission II card safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="locked-mission"><p class="mission-number">MISIÓN II · PRÓXIMAMENTE</p><p>La siguiente misión quedará disponible cuando la incorporemos a la aplicación.</p></div>'
          new='<div style="margin-top:18px"><p class="mission-number">MISIÓN II · DISPONIBLE</p><h3>El Puente de los Ahorcados</h3><p>La niebla cubre el Drakwasser. Al otro lado del puente aguarda el Rey Tumulario, último guardián del paso hacia Kappelburg.</p><p><b>4 héroes · Nivel recomendado 2 · 60–90 min</b></p><button class="hub-main-action" onclick="location.href=&quot;mision2.html&quot;">⚔ COMENZAR / CONTINUAR MISIÓN II</button></div>'
          if old not in s:
              raise SystemExit('No se encontró el bloque antiguo de Misión II')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Desbloquear Misión II sin romper el menú'
          git push