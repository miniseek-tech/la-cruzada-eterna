name: Añadir controles D66
on:
  push:
    paths:
      - '.github/workflows/add-d66-counter-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir botones sumar y restar D66
        shell: python
        run: |
          from pathlib import Path
          p=Path('campamento-equipo.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="gold">Tiradas D66 pendientes: <b id="pendingD66">0</b></div><p class="note">Las tiradas D66 concedidas por las misiones quedan registradas aquí hasta que las resolváis con vuestra tabla de botín.</p>'
          new='<div class="gold">Tiradas D66 pendientes: <b id="pendingD66">0</b></div><div class="item-row" style="margin:10px 0"><button onclick="changePendingD66(-1)">➖ RESTAR 1</button><button onclick="changePendingD66(1)">➕ AÑADIR 1</button></div><p class="note">Las tiradas D66 concedidas por las misiones quedan registradas aquí hasta que las resolváis con vuestra tabla de botín. También puedes ajustar manualmente el número de tiradas pendientes.</p>'
          if old not in s:
              raise SystemExit('No se encontró el bloque del contador D66')
          s=s.replace(old,new,1)
          anchor='function resolveD66(){'
          fn="function changePendingD66(delta){campaign.pendingD66=Math.max(0,(Number(campaign.pendingD66)||0)+Number(delta||0));save();render();setEquipStatus(delta>0?'Se ha añadido 1 tirada D66 pendiente.':'Se ha restado 1 tirada D66 pendiente.','ok')}"
          if anchor not in s:
              raise SystemExit('No se encontró resolveD66')
          s=s.replace(anchor,fn+anchor,1)
          p.write_text(s,encoding='utf-8')
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campamento-equipo.html
          git commit -m "Añadir botones para sumar y restar tiradas D66" || exit 0
          git push