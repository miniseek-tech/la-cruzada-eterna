name: Ficha de campaña con equipo
on:
  push:
    paths:
      - '.github/workflows/campaign-hero-equipment-summary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar equipo y fichas de campaña
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Separación visual de botones en equipo
          p=Path('campamento-equipo.html')
          s=p.read_text(encoding='utf-8')
          old='.item-row button{padding:9px 12px}'
          new='.item-row button{padding:9px 12px;margin:3px 2px}'
          if old not in s:
              raise SystemExit('No se encontró CSS de botones de equipo')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) Mostrar equipo y bonificaciones en las tarjetas de héroe del campamento
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.level-badge{float:right;border:1px solid #8a7045;padding:3px 7px;border-radius:10px;color:#d8bd7b}'
          new=old+'.campaign-equip{margin-top:8px;padding-top:7px;border-top:1px solid #463728}.campaign-equip b{display:inline;color:#d8bd7b}.campaign-bonus{display:inline-block;margin:3px 4px 0 0;padding:2px 6px;border:1px solid #765e35;border-radius:10px;font-size:.76rem}.campaign-item{font-size:.76rem;opacity:.82;margin-top:4px}'
          if old not in s:
              raise SystemExit('No se encontró level-badge')
          s=s.replace(old,new,1)

          anchor='function renderSaved(){'
          helpers="""function campaignNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')}function campaignEquipmentBonusFor(item){const n=campaignNorm(item);const out={M:0,F:0,A:0,I:0,CA:0,SALV:0};if(n.includes('armadura ligera'))out.SALV+=1;if(n.includes('armadura pesada'))out.SALV+=2;if(n==='escudo')out.SALV+=1;if(n.includes('espada / gran hacha / martillo a dos manos'))out.F+=2;if(n.includes('espada veloz'))out.A+=1;if(n.includes('martillo runico'))out.F+=1;if(n.includes('capa del viaje eterno')){out.M+=1;out.I+=1}if(n.includes('hacha runica de chrace'))out.F+=2;if(n.includes('manto del rey leon'))out.CA+=2;if(n.includes('escudo de athel loren'))out.CA+=1;return out}function campaignEquipmentSummary(h){const total={M:0,F:0,A:0,I:0,CA:0,SALV:0};const eq=Array.isArray(h.equipment)?h.equipment:[];for(const it of eq){const b=campaignEquipmentBonusFor(it);for(const k of Object.keys(total))total[k]+=b[k]||0}const labels={M:'M',F:'F',A:'A',I:'I',CA:'CA',SALV:'Salv.'};const chips=Object.entries(total).filter(([,v])=>v).map(([k,v])=>`<span class=\"campaign-bonus\">${labels[k]} +${v}</span>`).join('');const items=eq.length?`<div class=\"campaign-item\">Equipo: ${eq.join(' · ')}</div>`:'<div class=\"campaign-item\">Sin equipo asignado.</div>';return `<div class=\"campaign-equip\"><b>Modificadores de ficha:</b><div>${chips||'<small>Sin modificadores directos.</small>'}</div>${items}</div>`}"""
          if anchor not in s:
              raise SystemExit('No se encontró renderSaved')
          s=s.replace(anchor,helpers+anchor,1)

          old="document.getElementById('savedParty').innerHTML=campaign.heroes.map(h=>`<div class=\"hero-hub\"><span class=\"level-badge\">NIVEL ${h.level}</span><b>${h.name}</b><small>Jugador: ${h.owner}</small><small>Experiencia: ${h.xp}</small></div>`).join('');"
          new="document.getElementById('savedParty').innerHTML=campaign.heroes.map(h=>`<div class=\"hero-hub\"><span class=\"level-badge\">NIVEL ${h.level}</span><b>${h.name}</b><small>Jugador: ${h.owner}</small><small>Experiencia: ${h.xp}</small>${campaignEquipmentSummary(h)}</div>`).join('');"
          if old not in s:
              raise SystemExit('No se encontró render de savedParty')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campamento-equipo.html index.html
          git commit -m 'Mejorar fichas de campaña con equipo' || exit 0
          git push
