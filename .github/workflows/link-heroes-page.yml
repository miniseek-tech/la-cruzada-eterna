name: Enlazar página de Héroes
on:
  push:
    paths:
      - '.github/workflows/link-heroes-page.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enlazar Héroes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="onclick=\"showScreen('heroes')\""
          new="onclick=\"location.href='heroes.html'\""
          if old not in s:
              raise SystemExit('No se encontró el botón HÉROES')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enlazar Héroes con su página" || exit 0
          git push
