name: Corregir arco largo
on:
  push:
    paths:
      - '.github/workflows/fix-arco-largo.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir alcance y PA del arco largo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('equipo.html')
          s=p.read_text()
          old='<article class="item"><h3>Arco Largo</h3><div class="meta"><span class="price">20 coronas</span><span>8 casillas</span><span>PA −1</span></div><p>Arma de proyectiles de largo alcance.</p></article>'
          new='<article class="item"><h3>Arco Largo</h3><div class="meta"><span class="price">20 coronas</span><span>10 casillas</span></div><p>Arma de proyectiles de largo alcance.</p></article>'
          if old not in s:
              raise SystemExit('No se encontró la ficha exacta del Arco Largo')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipo.html
          git commit -m 'Corregir alcance del arco largo' || exit 0
          git push
