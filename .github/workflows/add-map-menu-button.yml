name: Add map button to real main menu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Mapa Imperial is present
        shell: python
        run: |
          from pathlib import Path
          p = Path('menu-redesign.js')
          s = p.read_text(encoding='utf-8')
          if 'MAPA IMPERIAL' in s:
              print('Mapa Imperial already present in real menu')
              raise SystemExit(0)
          anchor = "<button class=\"gothic-tile rules\" onclick=\"location.href=\\'reglamento.html?v=1\\'\"><span class=\"tile-art\">REGLAMENTO</span><b>REGLAMENTO</b><small>Reglas, referencias y tablas de consulta</small></button>"
          button = "<button class=\"gothic-tile map\" onclick=\"location.href=\\'mapa-imperio.html?v=4\\'\"><span class=\"tile-art\" style=\"background-image:none;color:#d7b46a;font-size:4.5rem;display:grid;place-items:center\">🗺</span><b>MAPA IMPERIAL</b><small>Explora las tierras de Kappelburg</small></button>"
          if anchor not in s:
              raise SystemExit('Rules tile anchor not found')
          p.write_text(s.replace(anchor, anchor + button, 1), encoding='utf-8')
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-redesign.js
          git commit -m "Integra Mapa Imperial en el menú real"
          git push
