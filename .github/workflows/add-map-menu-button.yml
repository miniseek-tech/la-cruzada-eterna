name: Add map button to real main menu

on:
  push:
    paths:
      - '.github/workflows/add-map-menu-button.yml'

permissions:
  contents: write

jobs:
  patch-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Mapa Imperial into redesigned menu
        shell: python
        run: |
          from pathlib import Path

          menu = Path('menu-redesign.js')
          s = menu.read_text(encoding='utf-8')
          if 'MAPA IMPERIAL' not in s:
              anchor = '<button class="gothic-tile rules" onclick="location.href=\\\'reglamento.html?v=1\\\'"><span class="tile-art">REGLAMENTO</span><b>REGLAMENTO</b><small>Reglas, referencias y tablas de consulta</small></button>'
              button = '<button class="gothic-tile map" onclick="location.href=\\\'mapa-imperio.html?v=4\\\'"><span class="tile-art" style="background-image:none;color:#d7b46a;font-size:4.5rem;display:grid;place-items:center">🗺</span><b>MAPA IMPERIAL</b><small>Explora las tierras de Kappelburg</small></button>'
              if anchor not in s:
                  raise SystemExit('Anchor REGLAMENTO not found; menu left untouched')
              s = s.replace(anchor, anchor + button, 1)
              menu.write_text(s, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('menu-redesign.js?v=3', 'menu-redesign.js?v=4')
          index.write_text(html, encoding='utf-8')

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-redesign.js index.html
          git commit -m "Integra Mapa Imperial en el menú real"
          git push
