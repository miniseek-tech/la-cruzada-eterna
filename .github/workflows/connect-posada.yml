name: Conectar menu de Posada
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/connect-posada.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar Posada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='onclick="showScreen(\'tavern\')"><small>🍺 CONTRATOS Y RUMORES</small><strong>MISIONES DE POSADA</strong>'
          new='onclick="location.href=\'posada.html\'"><small>🍺 CONTRATOS Y RUMORES</small><strong>MISIONES DE POSADA</strong>'
          if old not in s:
              raise SystemExit('No se encontró el botón antiguo de Posada')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Conectar acceso a Misiones de Posada' || exit 0
          git push