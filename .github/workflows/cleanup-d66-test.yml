name: Limpiar tiradas D66 de prueba
on:
  push:
    paths:
      - '.github/workflows/cleanup-d66-test.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar campamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('campamento-equipo.html')
          s=p.read_text(encoding='utf-8')
          old='''<p><button id="d66Button" onclick="resolveD66()">🎲 RESOLVER TIRADA D66</button> <button onclick="addTestD66()">+1 TIRADA D66 DE PRUEBA</button></p>'''
          new='''<p><button id="d66Button" onclick="resolveD66()">🎲 RESOLVER TIRADA D66</button> <button id="clearTestD66Button" onclick="clearTestD66()">🧹 LIMPIAR TIRADAS D66 DE PRUEBA</button></p>'''
          if old not in s:
              raise SystemExit('No se encontró el bloque de botones D66 esperado')
          s=s.replace(old,new,1)
          oldfn='''function addTestD66(){if(!campaign)return;campaign.pendingD66=(campaign.pendingD66||0)+1;save();render();const e=document.getElementById('d66Result');e.style.display='block';e.innerHTML='<b>Modo de prueba:</b> se ha añadido 1 tirada D66 pendiente. No modifica el progreso de ninguna misión.';}function resolveD66(){'''
          newfn='''function clearTestD66(){if(!campaign)return;if(!confirm('¿Poner a 0 las tiradas D66 pendientes creadas durante las pruebas? No se modificarán coronas, inventario, equipo ni progreso de campaña.'))return;campaign.pendingD66=0;save();render();const e=document.getElementById('d66Result');e.style.display='block';e.innerHTML='<b>Pruebas D66 limpiadas.</b><br>Las tiradas pendientes están ahora en 0. No se han modificado coronas, inventario, equipo ni progreso de campaña.';}function resolveD66(){'''
          if oldfn not in s:
              raise SystemExit('No se encontró la función de prueba D66 esperada')
          s=s.replace(oldfn,newfn,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add campamento-equipo.html
          git commit -m 'Limpiar tiradas D66 de prueba' || exit 0
          git push
