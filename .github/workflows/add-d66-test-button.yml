name: Añadir botón de prueba D66
on:
  push:
    paths:
      - '.github/workflows/add-d66-test-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir botón de prueba D66
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('campamento-equipo.html')
          s=p.read_text()
          old='<p><button id="d66Button" onclick="resolveD66()">🎲 RESOLVER TIRADA D66</button></p>'
          new='<p><button id="d66Button" onclick="resolveD66()">🎲 RESOLVER TIRADA D66</button> <button onclick="addTestD66()">+1 TIRADA D66 DE PRUEBA</button></p>'
          if old not in s:
              raise SystemExit('No se encontró el botón D66 esperado')
          s=s.replace(old,new,1)
          marker='function resolveD66(){'
          insert="function addTestD66(){if(!campaign)return;campaign.pendingD66=(campaign.pendingD66||0)+1;save();render();const e=document.getElementById('d66Result');e.style.display='block';e.innerHTML='<b>Modo de prueba:</b> se ha añadido 1 tirada D66 pendiente. No modifica el progreso de ninguna misión.';}"
          if marker not in s:
              raise SystemExit('No se encontró resolveD66')
          s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
          git rm .github/workflows/add-d66-test-button.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add campamento-equipo.html
          git commit -m 'Añadir tirada D66 de prueba'
          git push