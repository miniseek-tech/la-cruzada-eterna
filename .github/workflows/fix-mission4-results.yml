name: Corregir resultados Mision IV
on:
  push:
    paths:
      - '.github/workflows/fix-mission4-results.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir Mision IV
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mision4.html')
          s=p.read_text(encoding='utf-8')
          marker='<small>✦ RECOMPENSAS DE VICTORIA</small>'
          pos=s.find(marker)
          if pos<0: raise SystemExit('No se encontro recompensas')
          div=s.rfind('<div class="card">',0,pos)
          if div>=0: s=s[:div]+s[div:].replace('<div class="card">','<div id="victoryRewards" class="card">',1)
          insert="""<script>(function(){function applyM4Result(){var st={};try{st=JSON.parse(localStorage.getItem('cruzadaMission4')||'{}')}catch(e){}var r=document.getElementById('victoryRewards'),box=document.getElementById('resolution');if(!r)return;if(st.outcome==='defeat'){r.style.display='none';return}r.style.display='';if(st.outcome==='victory'&&box&&st.hunter&&st.stake&&st.scroll&&st.explore){box.hidden=false;box.innerHTML='<h3 class=\"victory\">✦ VICTORIA ABSOLUTA</h3><p>Los tres sellos han sido destruidos, los héroes han alcanzado la salida y se han completado todos los objetivos secundarios. <b>Misión V desbloqueada.</b></p>'}}document.addEventListener('click',function(){setTimeout(applyM4Result,0)});window.addEventListener('load',applyM4Result);setTimeout(applyM4Result,0)})();</script>"""
          s=s.replace('</body>',insert+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar
        run: |
          grep -q 'id="victoryRewards"' mision4.html
          grep -q 'VICTORIA ABSOLUTA' mision4.html
          grep -q "st.outcome==='defeat'" mision4.html
      - name: Publicar
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mision4.html
          git commit -m 'Corregir resultados de Mision IV'
          git push
