name: Normalizar recompensas de campaña
on:
  push:
    paths:
      - '.github/workflows/normalize-campaign-rewards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python normalize_campaign_rewards.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mision3.html mision4.html mision5.html campamento-equipo.html
          git diff --cached --quiet || git commit -m "Unificar recompensas y progreso de campaña"
          git push
