<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · Enanos del Caos</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.actions article{padding:12px;margin:8px 0;background:#17110d;border-left:3px solid #7b2c20}.actions b{color:#d09a72}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#15100c;border:1px solid #493723;line-height:1.5}.enemy-title{text-align:center}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">ENANOS DEL CAOS · HIJOS DE LA FORJA OSCURA</p></header><main><section id="list"><a href="bestiario.html?v=2" style="text-decoration:none"><button>← VOLVER A FACCIONES</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>Enanos del Caos</h2><p>Consulta rápida para la mesa. Pulsa sobre un enemigo para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A ENANOS DEL CAOS</button><div id="content"></div></section></main></div><script>const E={
'Enano del Caos':{sub:'Infantería · Caos · Seguidor del Caos',s:{M:4,HA:4,HP:2,F:4,R:4,H:3,I:2,A:2,L:2},save:'4+ · RM 1',eq:'Armadura caótica pesada, hacha del caos y escudo del caos.',rules:['Carne de piedra: obtiene Resistencia a la Magia 1.','Duros de pelar: la primera vez que fuera a morir, lanza 1D6. Con 5+, se levanta con 1 Herida.'],a:[['1/2','Avance imparable','Dobla su Movimiento para efectuar una carga. Si ya está en combate, gana +1 Ataque.'],['3/4','Hachazo brutal','Realiza sus ataques. Si hiere a su enemigo, obtiene PA -2 hasta el final del turno.'],['5','Defensa férrea','Carga si puede. Si está en combate, gana +2 a la CA; después ataca.'],['6','¡Por el Caos!','Todas las unidades enemigas hasta 6 casillas deben superar un chequeo de Liderazgo o sufren -1 a HA y -1 a I hasta su siguiente turno.']]},
'Ballestero Enano del Caos':{sub:'Infantería · Caos · Tirador',s:{M:3,HA:4,HP:1,F:3,R:3,H:1,I:2,A:1,L:8},save:'5+ · RM 1',eq:'Ballesta pesada, armadura caótica y escudo.',rules:['Carne de piedra: obtiene Resistencia a la Magia 1.','Disparo certero: si no se ha movido este turno, obtiene +1 a impactar con sus disparos.'],a:[['1/2','Recargar y apuntar','Este turno no puede moverse. Hasta su siguiente turno obtiene +1 a impactar.'],['3/4','Disparo de ballesta','Realiza un disparo. Alcance 10 casillas. Fuerza 4. PA -1.'],['5','Disparo perforante','Realiza un disparo. Alcance 10 casillas. Fuerza 4. PA -2. Si hiere, el objetivo sufre -1 a su salvación especial hasta el final del turno.'],['6','Descarga caótica','Realiza 2 disparos. Alcance 10 casillas. Impacta en 5+. Fuerza 4. PA -1.']]},
'Martillos Abismales':{sub:'Infantería de Élite · Caos · Seguidores del Caos',s:{M:3,HA:5,HP:3,F:4,R:4,H:2,I:2,A:2,L:8},save:'5+',eq:'Arma a dos manos, armadura caótica pesada y casco con cuernos.',rules:['Fanáticos del Abismo: inmunes a miedo, terror y pánico. Si cargan, obtienen +1 a impactar ese turno.','Golpe Abismal: si el enemigo sufre una o más heridas por un ataque de esta unidad, debe superar un chequeo de Liderazgo o queda Aturdido hasta su siguiente turno.'],a:[['1/2','Carga devastadora','Carga al objetivo más cercano; si lo logra gana “Ataca primero”. Si ya está en combate, ataca con normalidad.'],['3/4','Golpe abismal','Sus ataques alcanzan a todos los objetivos adyacentes. Si no está en combate, carga si puede.'],['5','Aplastar','Realiza un único ataque con +1 al impactar. Si logra acertar, niega la tirada de salvación del enemigo.'],['6','Embate del Abismo','Realiza 3 ataques. Fuerza 4. PA -1.']]},
'Zharruk Quebrantahierro':{sub:'Capataz del Alijo · Jefe Enano del Caos',s:{M:3,HA:5,HP:2,F:4,R:4,H:4,I:2,A:2,L:9},save:'4+',eq:'Martillo rúnico oscuro a dos manos: +2 Fuerza, PA -1.',rules:['Proteged el alijo: mientras Zharruk esté vivo, todos los enanos del caos a 6 casillas pueden repetir una tirada fallida de Liderazgo.','Castigo del Hashut: una vez por partida, si impacta con sus dos ataques contra el mismo héroe y al menos uno hiere, causa una herida adicional automática.','Jefe cruel: cuando un enano del caos cercano muere, Zharruk gana +1 al impactar hasta el final de su siguiente turno.','Voluntad de hierro negro: la primera vez que Zharruk fuera a quedar a 0 Heridas, tira 1D6. Con 5+, queda con 1 Herida.'],a:[['1/2','Golpe triturador','Realiza 1 ataque con su Martillo rúnico. Si logra herir, el objetivo debe superar un chequeo de Resistencia o será Empujado 2 casillas y Derribado.'],['3/4','Barrido despiadado','Realiza 2 ataques con su Martillo rúnico contra objetivos diferentes dentro de 2 casillas. Si ambos ataques impactan, obtiene +1 al impactar hasta el final de su siguiente turno.'],['5','Mandato de dolor','Elige a un enano del caos a 6 casillas. Ese enano puede realizar inmediatamente una acción adicional este turno: mover, cargar o atacar.'],['6','Aplastar al débil','Elige un objetivo adyacente. Si Zharruk hiere, ese objetivo sufre -1 a la Resistencia hasta el final de su siguiente turno.']],loot:'3D6+15 coronas y un fragmento rúnico oscuro vendible por 50 coronas. Con un 6 en 1D6, se encuentra una runa menor corrupta.'}
};const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n],stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>',loot=d.loot?'<div class="enemy-note"><b>BOTÍN</b><p>'+d.loot+'</p></div>':'';L.hidden=true;S.hidden=false;C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2 class="enemy-title">'+n+'</h2><p class="hero-subtitle" style="text-align:center">'+d.sub+'</p>'+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><div class="enemy-note"><b>EQUIPO</b><p>'+d.eq+'</p></div><h3>REGLAS ESPECIALES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div><h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div>'+loot;scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
