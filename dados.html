<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Dados · La Cruzada Eterna</title><style>.dice-panel{max-width:680px;margin:auto}.dice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.die{min-height:78px;font-size:1.1rem}.die strong{display:block;font-size:1.45rem}.result{margin:20px 0;padding:25px 14px;text-align:center;border:1px solid #84673d;background:rgba(29,20,13,.78);border-radius:12px}.result small{display:block;color:#b9a786;letter-spacing:.12em}.result strong{display:block;font-size:3.2rem;color:#e2c47e;margin:5px}.result p{margin:5px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button{width:100%}.history{margin-top:20px}.history p{padding:8px 10px;margin:5px 0;border-bottom:1px solid #493b2e;color:#c9bda8}.custom{display:flex;gap:8px;margin:18px 0}.custom input{width:80px;background:#17110e;color:#eee;border:1px solid #66513b;padding:10px;border-radius:6px}.custom button{flex:1}@media(max-width:480px){.dice-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">⬡</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>DADOS</h1><div class="ornament">◆ ━━━━━ ✦ ━━━━━ ◆</div><p class="motto">QUE LOS DIOSES DECIDAN</p></header><main><section class="dice-panel"><a href="./" style="text-decoration:none"><button>← VOLVER AL MENÚ</button></a><div class="result"><small>ÚLTIMA TIRADA</small><strong id="total">—</strong><p id="detail">Elige un dado</p></div><div class="dice-grid"><button class="die" data-sides="3"><strong>D3</strong>1–3</button><button class="die" data-sides="4"><strong>D4</strong>1–4</button><button class="die" data-sides="6"><strong>D6</strong>1–6</button><button class="die" data-sides="8"><strong>D8</strong>1–8</button><button class="die" data-sides="10"><strong>D10</strong>1–10</button><button class="die" data-sides="12"><strong>D12</strong>1–12</button><button class="die" data-sides="20"><strong>D20</strong>1–20</button><button class="die" data-special="d66"><strong>D66</strong>11–66</button><button class="die" data-special="2d6"><strong>2D6</strong>2–12</button></div><p class="section-kicker">TIRADA MÚLTIPLE</p><div class="custom"><input id="qty" type="number" min="1" max="20" value="3"><button id="multi">TIRAR D6</button></div><div class="controls"><button id="repeat">↻ REPETIR</button><button id="clear">✕ LIMPIAR</button></div><div class="history"><p class="section-kicker">HISTORIAL</p><div id="history"><p>Aún no hay tiradas.</p></div></div></section></main></div><script>const total=document.getElementById('total'),detail=document.getElementById('detail'),hist=document.getElementById('history');let last=null,history=[];const rnd=n=>Math.floor(Math.random()*n)+1;function show(label,vals,value,fn){total.textContent=value;detail.textContent=label+' · '+vals.join(' + ');history.unshift(label+' → '+vals.join(', ')+' = '+value);history=history.slice(0,8);hist.innerHTML=history.map(x=>'<p>'+x+'</p>').join('');last=fn}function die(n){const fn=()=>{const v=rnd(n);show('1D'+n,[v],v,fn)};fn()}function d66(){const fn=()=>{const a=rnd(6),b=rnd(6),v=a*10+b;show('D66',[a,b],v,fn)};fn()}function two(){const fn=()=>{const a=rnd(6),b=rnd(6);show('2D6',[a,b],a+b,fn)};fn()}function multi(){let q=Math.max(1,Math.min(20,+document.getElementById('qty').value||1));const fn=()=>{const a=Array.from({length:q},()=>rnd(6));show(q+'D6',a,a.reduce((x,y)=>x+y,0),fn)};fn()}document.querySelectorAll('[data-sides]').forEach(b=>b.onclick=()=>die(+b.dataset.sides));document.querySelector('[data-special="d66"]').onclick=d66;document.querySelector('[data-special="2d6"]').onclick=two;document.getElementById('multi').onclick=multi;document.getElementById('repeat').onclick=()=>last&&last();document.getElementById('clear').onclick=()=>{history=[];hist.innerHTML='<p>Aún no hay tiradas.</p>';total.textContent='—';detail.textContent='Elige un dado';last=null};</script></body></html>
