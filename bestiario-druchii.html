<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · Elfos Oscuros</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.actions article{padding:12px;margin:8px 0;background:#17110d;border-left:3px solid #63356f}.actions b{color:#c79ad7}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#15100c;border:1px solid #493723;line-height:1.5}.spell{padding:9px;margin:6px 0;background:#17110d}.enemy-title{text-align:center}.purple{color:#c79ad7}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">ELFOS OSCUROS · DRUCHII</p></header><main><section id="list"><a href="./" style="text-decoration:none"><button>← VOLVER A LA CRUZADA</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>Elfos Oscuros</h2><p>Consulta rápida para la mesa. Pulsa sobre una criatura para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A ELFOS OSCUROS</button><div id="content"></div></section></main></div><script>const E={
'Corsario Elfo Oscuro':{sub:'Saqueador de Naggaroth',s:{M:5,HA:4,HP:4,F:3,R:3,H:1,I:5,A:2,L:8},save:'5+',eq:'Dos armas de mano (sables corsarios), armadura ligera y Capa de Dragón Marino.',rules:['Saqueador de Naggaroth: si elimina a un héroe, le saqueará 1D6 coronas.','Capa de Dragón Marino: la gruesa capa desvía parte de los golpes. El Corsario tiene Salvación 5+.','Crueldad Druchii: si un héroe a 6 casillas o menos tiene 1 sola herida restante, obtiene +1 para impactar contra él.'],a:[['1-2','Asalto Relámpago','Carga contra el héroe más cercano. Si ya está en combate, realiza sus dos ataques con normalidad.'],['3-4','Torbellino de Acero','Realiza dos ataques. Si ambos impactan, efectúa un tercer ataque gratuito.'],['5','Rodeadlo','Se mueve para buscar el flanco o la retaguardia del héroe más cercano. Si ya está en esa posición, obtiene +1 Fuerza en sus ataques este turno.'],['6','¡Por Naggaroth!','Todos los Corsarios a 6 casillas obtienen +1 Movimiento y +1 Ataque hasta el comienzo del siguiente turno del Maestro.']]},
'Ballestero de Repetición':{sub:'Elfo Oscuro de Naggaroth',s:{M:5,HA:4,HP:4,F:3,R:3,H:1,I:5,A:1,L:8},save:'6+ · 5+ vs proyectiles',eq:'Ballesta de Repetición (alcance 10 casillas), daga, armadura ligera y Capa de Dragón Marino.',rules:['Disparo Rápido: puede realizar un Disparo de Repetición y luego mover hasta 2 casillas.','Puntería Sombría: si no se ha movido este turno, obtiene +1 para impactar con su Ballesta de Repetición.','Maestros de la Distancia: nunca están afectados por Miedo mientras tengan línea de visión.','Disparo de Repetición: -1 para impactar si el objetivo está a más de 5 casillas.'],a:[['1-2','Disparo Preciso','Realiza un Disparo de Repetición contra el héroe más cercano a 10 casillas. Si ya está en combate, dispara al objetivo en combate más cercano.'],['3-4','Cambiar Objetivo','Dispara a un héroe diferente al que disparó el turno anterior, buscando siempre el objetivo más vulnerable.'],['5','Retroceder y Disparar','Se mueve hasta 2 casillas hacia atrás o a cobertura y luego realiza un Disparo de Repetición.'],['6','Lluvia de Virotes','Todos los Ballesteros de Repetición a 6 casillas pueden realizar un Disparo de Repetición este turno.']]},
'Elfa Bruja de Hag Graef':{sub:'Bruja de Naggaroth',s:{M:7,HA:4,HP:4,F:3,R:3,H:1,I:6,A:2,L:9},save:'5+',eq:'Daga de mano venenosa, Varita de bruja, armadura ligera y Capa de Seda Negra (Salvación 5+ frente a proyectiles).',rules:['Mujeres de la Noche: siempre actúan en la fase de Iniciativa, incluso si cargaron ese turno.','Magia Oscura: obtiene 2 dados de Energía por turno y puede intentar lanzar un hechizo de Brujería una vez por turno.','Danza Sombría: puede moverse a través de unidades amigas y enemigos sin penalizador de movimiento.'],spells:[['1','Dolor Agudo','El objetivo sufre -1 a HA hasta su próximo turno.'],['2','Sombras Envolventes','El objetivo supera Liderazgo o no podrá realizar acciones mágicas ni Disparar hasta su próximo turno.'],['3','Drenar Esencia','La Bruja recupera 1 Herida. El objetivo sufre 1 Herida sin salvación.'],['4','Maldición de Khaine','El objetivo sufre -1 a su Salvación hasta su próximo turno.'],['5','Tormenta de Sombras','Todos los enemigos a 6 casillas sufren 1 impacto automático (Salvación normal).'],['6','Risa de la Tortura','El objetivo supera Liderazgo o huye 2D6 casillas en la dirección más corta posible, si puede.']],a:[['1-2','Acosar desde las Sombras','Carga buscando siempre que puedas la espalda de un héroe; si lo logras obtienes +1 al impactar. Si ya estás en combate, ataca con normalidad.'],['3-4','Danza de Muerte','Se acerca al combate y realiza 2 ataques con su daga. Si ya está en combate, obtiene +1 a Iniciativa este turno.'],['5','Hechizo Oscuro','Intenta lanzar un hechizo de Brujería contra el héroe más cercano.'],['6','Llamada de Hag Graef','Todas las Elfas Brujas a 6 casillas obtienen +1 a Iniciativa y +1 para impactar hasta el inicio del próximo turno del Maestro.']]},
'Draelith Garra Sombría':{sub:'Señor Supremo de Naggaroth',s:{M:6,HA:8,HP:3,F:5,R:5,H:3,I:8,A:4,L:10},save:'4+ · Especial 5+',eq:'Espada Sombría (2 manos, Malicia), Armadura de Escamas de Sangre, Amuleto de las Sombras y Capa de las Alas Nocturnas.',rules:['Señor de Naggaroth: todos los elfos brujos y unidades a 12 casillas obtienen +1 a la Iniciativa.','Dominio de las Sombras: puede repetir cualquier tirada de hechizo fallido una vez por turno.','Malicia Letal: sus ataques causan Daño Mágico.','Evasión Sombría: cada turno puede moverse a través de terrenos y unidades amigas.','Maestro Manipulador: puede intentar lanzar 2 hechizos por turno.','Aura de Terror: enemigos a 6 casillas superan Liderazgo al inicio de su turno o sufren -1 a todas sus tiradas hasta el final del turno.','Seducción Sombría: una vez por batalla elige una unidad enemiga a 6 casillas; si falla Liderazgo no podrá usar sus Acciones este turno.','Regeneración Sombría: al final de su turno recupera 1 Herida si tiene al menos 1 punto de Energía.','Magia Oscura: obtiene 3 dados de Energía por turno. Hechizos preferentes: Mirada de Nagash, Maldición de los Años, Drenar Vida y Tormenta de Sombras.','Explosión Sombría: al morir, todas las unidades a 3 casillas sufren 1 impacto de F5 sin salvación (Daño Mágico). Después retíralo del juego.'],a:[['1','Carga Sombría','Carga al héroe más cercano.'],['2','Golpe Devastador','Si ya está en combate, realiza todos sus ataques.'],['3','Hechizo Destructivo','Lanza un hechizo de Brujería.'],['4','Maniobra Sombría','Se mueve hasta 6 casillas buscando cobertura o flanqueo.'],['5','Aura de Terror','Activa su Aura. Todas las unidades enemigas a 6 casillas superan Liderazgo o sufren -1 a todas sus tiradas este turno.'],['6','Ira de Naggaroth','Obtiene +1 Ataque y +1 Fuerza hasta el final del turno.']],loot:'1-2: 2D6 Coronas · 3-4: Arma Élfica Sombría (Objeto Mágico) · 5: Pergamino de Hechizo de Brujería · 6: Gema de Poder Oscuro (Objeto Épico)'}
};const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n],stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>',sp=d.spells?'<h3>BRUJERÍA DE NAGGAROTH · 1D6</h3>'+d.spells.map(x=>'<div class="spell"><b class="purple">'+x[0]+' · '+x[1]+'</b><br>'+x[2]+'</div>').join(''):'',loot=d.loot?'<div class="enemy-note"><b>BOTÍN</b><p>'+d.loot+'</p></div>':'';L.hidden=true;S.hidden=false;C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2 class="enemy-title">'+n+'</h2><p class="hero-subtitle" style="text-align:center">'+d.sub+'</p>'+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><div class="enemy-note"><b>EQUIPO</b><p>'+d.eq+'</p></div><h3>REGLAS ESPECIALES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div>'+sp+'<h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div>'+loot;scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
