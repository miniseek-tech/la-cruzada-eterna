<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · No Muertos</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.enemy{display:none}.enemy.active{display:block}.actions article{padding:12px;margin:8px 0;background:#17110d;border-left:3px solid #6e3b59}.actions b{color:#d6b36d}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#15100c;border:1px solid #493723;line-height:1.5}.enemy h2{text-align:center}.enemy .hero-subtitle{text-align:center}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">NO MUERTOS</p></header><main><section id="list"><a href="./" style="text-decoration:none"><button>← VOLVER A LA CRUZADA</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>No Muertos</h2><p>Consulta rápida para la mesa. Pulsa sobre una criatura para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A NO MUERTOS</button><div id="content"></div></section></main></div><script>const E={
'Nigromante':{sub:'Sirviente de la No Vida',s:{M:4,HA:4,HP:3,F:3,R:3,H:3,I:6,A:2,L:8},save:'5+',eq:'Bastón de Nigromancia: ataques mágicos de F3. Vestiduras Nigrománticas: Salvación 5+. No puede llevar armadura ni escudo.',rules:['Señor de los No Muertos: los No Muertos a 12 casillas o menos repiten Liderazgo fallido.','Robavidas: cuando causa heridas con un ataque mágico recupera 1 Herida, hasta su máximo.','Cobardes pero astutos: intenta mantenerse lo más alejado posible de los enemigos para lanzar sus hechizos.'],a:[['1','Invocar Esqueletos','Invoca 1D3 Esqueletos en una casilla libre a 6 casillas o menos.'],['2','Drenar Vida','Elige un héroe a 6 casillas o menos. Ataque mágico F3; si hiere, causa 1 Herida y el Nigromante recupera 1 Herida.'],['3','Maldición de los Años','Elige un héroe hasta 8 casillas. Lanza 1D6 por cada dado de energía disponible; cada 6+ causa una herida sin salvación.'],['4','Llamar a los Muertos','Cada héroe vivo supera Liderazgo o aparece un Esqueleto junto a él y se considera una carga.'],['5','Necrótica','Elige un punto a 6 casillas o menos. Las miniaturas enemigas en contacto con el punto sufren un impacto de F4.'],['6','Vórtice de Almas','Elige un héroe a 6 casillas o menos. Sufre 1D3 Heridas sin salvación. El Nigromante recupera 1 Herida por cada Herida causada.']]},
'Esqueleto':{sub:'Infantería · No Muertos · Unidad Básica',s:{M:4,HA:3,HP:2,F:3,R:3,H:1,I:2,A:1,L:5},save:'5+',eq:'Lanza y escudo.',rules:['No sienten dolor. Inmunes a Psicología.','No muerto: cuando muera el señor que lo invocó, al comienzo de cada turno supera Liderazgo o sufre una herida sin salvación.'],a:[['1/2','Avanza implacable','Mueve hasta su movimiento completo hacia el enemigo más cercano. Si puede, carga.'],['3/4','Defensa ósea','Si está en contacto con un enemigo obtiene +1 a su Salvación por armadura. Después, ataca.'],['5/6','Ataque con lanza','Carga si puede; si ya está en combate, ataca al enemigo más cercano con su lanza. Puede repetir las tiradas para impactar y herir.']]},
'Esqueleto Arquero':{sub:'Infantería · No Muertos · Unidad Básica',s:{M:4,HA:3,HP:2,F:3,R:2,H:1,I:2,A:1,L:2},save:'5+',eq:'Arco simple y carcaj de flechas.',rules:['No sienten dolor. Inmunes a Psicología.','No muerto: cuando el señor que lo invocó muera, al comienzo de cada turno debe superar un chequeo de Liderazgo o sufrirá una herida sin salvación.'],a:[['1/2','Disparo certero','Si el Esqueleto Arquero no ha cargado este turno, puede disparar. Elige un enemigo a distancia y realiza un ataque con su arco.'],['3/4','Descarga rápida','Dispara hasta 2 veces a objetivos a distancia distintos. Cada disparo se resuelve por separado.'],['5','Ajustar la puntería','Si no se movió este turno, obtiene +1 a impactar con sus disparos este turno.'],['6','Lluvia de flechas','Todos los Esqueletos Arqueros hasta 10 casillas pueden disparar este turno, incluso si cargaron.']]},
'Zombi':{sub:'Infantería · No Muertos · Unidad Básica',s:{M:4,HA:2,HP:2,F:3,R:2,H:1,I:2,A:1,L:2},save:'6+',eq:'Armas rudimentarias.',rules:['No sienten dolor. Inmunes a Psicología.','No muerto: cuando muera el señor que lo invocó, al comienzo de cada turno supera Liderazgo o sufre una herida sin salvación.'],a:[['1/2','Huele a vivo','Carga al enemigo más cercano y después ataca. Si ya está en combate, ataca con normalidad.'],['3/4','Desorientado','Lanza 1D6: con 1-3 ataca al enemigo más cercano; con 4-6 ataca a un aliado cercano.'],['5/6','Agggh oggghh','Este Zombi y todos los Zombis hasta 10 casillas ganan +2 Movimiento y +1 Fuerza si pueden cargar este turno.']]},
'Necrófago':{sub:'Infantería · No Muertos · Monstruosa Ligera',s:{M:4,HA:3,HP:0,F:4,R:4,H:2,I:3,A:2,L:5},save:'6+',eq:'Garras y dientes. Ataques envenenados: 6 natural al impactar hiere automáticamente.',rules:['No muerto: inmune a miedo y terror; no puede huir voluntariamente.','Devorador de cadáveres: si mata a un héroe u otro objetivo vivo recupera 1 Herida, hasta un máximo de 2.','Hambre insaciable: si comienza su activación a 4 casillas o menos de un héroe herido obtiene +1 M durante esa activación.'],a:[['1/2','Embestida hambrienta','Carga contra el héroe más cercano. Si carga obtiene +1 al impactar este turno. Si ya está en combate realiza sus ataques normalmente.'],['3/4','Frenesí de garras','Realiza sus ataques. Si ambos impactan, realiza 1 ataque adicional inmediatamente.'],['5','Despedazar','Realiza 1 único ataque con +1 F y PA -2.'],['6','Hambre desatada','Carga contra el héroe herido más cercano. Si ya está en combate realiza sus ataques y obtiene +1 Ataque este turno.']]},
'Campeón Tumulario':{sub:'Infantería de Élite · No Muertos · Unidad Especial',s:{M:4,HA:4,HP:2,F:4,R:4,H:2,I:3,A:2,L:8},save:'4+',eq:'Armadura tumularia, escudo de los túmulos y espada de los túmulos. Con un 6 al herir, la espada niega salvación por armadura no mágica.',rules:['Provoca Miedo. Inmune a Miedo.','No muerto: cuando muera el señor que lo invocó, al comienzo de cada turno supera Liderazgo o sufre una herida sin salvación.'],a:[['1/2','Guardia eterna','Carga al enemigo más cercano si puede. Si ya está en combate, ataca con normalidad.'],['3/4','Golpe implacable','Ataca al enemigo más cercano con su espada. Puede repetir las tiradas para impactar.'],['5','Defensor de los túmulos','Si es atacado en combate obtiene +1 a la Salvación por armadura hasta el final del turno.'],['6','Venganza tumularia','Ataca a todos los enemigos adyacentes si es posible. Puede repetir las tiradas para herir.']]},
'Espectro':{sub:'Infantería · No Muertos · Unidad Especial',s:{M:8,HA:5,HP:'–',F:3,R:4,H:2,I:6,A:2,L:8},save:'4+',eq:'Ropajes espectrales y guadaña etérea. Con un 6 al herir, la guadaña niega salvación por armadura no mágica.',rules:['Provoca Miedo. Inmune a Miedo.','Etéreo: puede atravesar personas y enemigos; no puede terminar sobre una casilla enemiga salvo para atacar.'],a:[['1/2','Desvanecerse','Gana +2 a la Iniciativa; después carga si puede.'],['3/4','Toque espectral','Ataca a un enemigo adyacente. Si hiere, la víctima sufre -1 F y -1 R hasta su siguiente turno.'],['5','Lamento de ultratumba','Enemigos hasta 6 casillas superan Liderazgo o sufren -1 HA e I hasta su siguiente turno.'],['6','Viene a por ti','Carga si puede; después realiza sus ataques y gana 1D6 ataques extra.']]},
'Rey Tumulario':{sub:'Señor de las tumbas · Caudillo eterno',s:{M:4,HA:5,HP:5,F:5,R:5,H:6,I:4,A:4,L:9},save:'4+',eq:'Armadura funeraria pesada, Espada Tumularia de los Mil Juramentos y Escudo de la Cripta Eterna. La espada otorga Golpe Heroico.',rules:['Señor de las Tumbas: No Muertos a 6 casillas obtienen +1 Liderazgo.','Aura de Descomposición: enemigos a 1 casilla sufren -1 Liderazgo.','¡Levantad los Estandartes del Rey!: Tumularios, Esqueletos y No Muertos a 6 casillas obtienen +1 HA y +1 Liderazgo hasta su siguiente turno.','La Maldición del Sepulcro: al ser destruido, héroes a 2 casillas sufren impacto F5 PA -2; si fallan salvación sufren 1D3 heridas. Después realiza una última activación.'],a:[['1/2','Golpe Real','Ataca al héroe más cercano. Si impacta realiza un ataque adicional con F+1.'],['3/4/5','Arremetida Tumularia','Mueve hasta 2D6 casillas en línea recta y ataca a todos los héroes en su camino con F+1. Cada ataque permite salvación.'],['6','Alzaos mis siervos','Invoca 1D3 Esqueletos y colócalos hasta 6 casillas. Después carga o ataca si ya está en combate.']]},
'Varkhos':{sub:'Señor Vampiro · No Muertos · Antagonista',s:{M:4,HA:6,HP:4,F:5,R:5,H:6,I:6,A:3,L:10},save:'4+',eq:'Espada Carmesí. Varkhos dispone de 3 Dados de Magia por turno.',rules:['Vampiro: provoca Terror y es inmune a Miedo y Terror.','Señor de la No Muerte: Varkhos comanda a los No Muertos que le sirven.','Hechicero vampírico: conoce seis hechizos y dispone de 3 Dados de Magia por turno.','Combate por fases: utiliza sus acciones y reglas de fase correspondientes durante el enfrentamiento final.'],a:[['1/2','Ataque del Señor Vampiro','Carga al héroe más cercano si puede. Si ya está en combate, realiza sus ataques con la Espada Carmesí.'],['3/4','Poder de la Sangre Negra','Canaliza su poder vampírico y utiliza una de sus capacidades mágicas disponibles.'],['5','Dominio de Varkhos','Activa una de sus capacidades especiales de combate según la fase actual del enfrentamiento.'],['6','Furia del Señor de la Sangre','Desata su acción especial correspondiente a la fase actual del combate.']]},
'Enjambre de Murciélagos':{sub:'Bandada de No Muertos Voladores',s:{M:'6 (vuelo)',HA:3,HP:0,F:3,R:3,H:5,I:4,A:5,L:5},save:'6+',eq:'Colmillos desgarradores, garras esqueléticas y furia instintiva.',rules:['Vuelo Necromántico: puede sobrevolar obstáculos y unidades. No puede marchar a menos que esté cerca de un Nigromante o Vampiro.','Ataques Envenenados (No Muerto): los impactos exitosos de combate provocan -1 a la Resistencia del objetivo durante el turno actual.'],a:[['1/2','Carga de Plaga','Mueve y ataca a la unidad enemiga más cercana. Los objetivos deben superar un chequeo de Liderazgo o sufrir una herida adicional.'],['3/4/5','Mordisco Pavoroso','Carga si puede; si ya está en combate, ataca con normalidad. Por cada herida causada, el objetivo deberá superar un chequeo de Liderazgo o huirá 3 casillas en dirección opuesta.'],['6','Chillido Agónico','Todos los héroes hasta 4 casillas deberán superar un chequeo de Liderazgo con -1; si fallan reciben una herida sin salvación no mágica.']]},
'Enjambre de Ratas':{sub:'Enjambre · No Muertos',s:{M:8,HA:3,HP:0,F:3,R:3,H:4,I:3,A:4,L:3},save:'6+',eq:'Dientes, garras y una masa interminable de cuerpos.',rules:['Enjambre: puede desplazarse entre unidades y atravesar espacios estrechos.','Provoca Miedo.'],a:[['1','Plaga','El enjambre avanza en todas direcciones. Muévete 8 casillas libremente. Ignora los enemigos al moverte.'],['2','Mordisco','Carga si puedes; si ya estás en combate, ataca con normalidad. Todos los enemigos en contacto sufren 1 Herida (F3), sin salvación por armadura.'],['3','Oleada Devastadora','Todos los enemigos adyacentes deben superar un chequeo de Liderazgo o reciben 1 Herida (F3), sin salvación por armadura.'],['4','Invadir','Muévete 8 casillas y puedes atravesar terreno difícil o puertas cerradas.'],['5','Reagruparse','Ganas +1 a tu Salvación hasta tu siguiente turno.'],['6','Rabia Desenfrenada','Este turno obtiene +1 Ataque y repite las tiradas para impactar.']]},
'Lobo Espectral':{sub:'Criatura menor · No Muerto · Etéreo',s:{M:12,HA:4,HP:0,F:3,R:3,H:2,I:6,A:3,L:6},save:'5+ (sin armadura)',eq:'Garras y colmillos espectrales. Solo puede ser herido por armas mágicas.',rules:['Etéreo: puede moverse a través de terreno difícil y enemigos sin penalización. Solo puede ser herido por armas mágicas.','Terror: todos los héroes que lo vean a 4 casillas o menos deberán superar un chequeo de Liderazgo con -1. Si fallan, no podrán usar Acciones este turno.','Nigromancia Salvaje: si es destruido, coloca una ficha de Restos Espectrales en su casilla. Al inicio de cada turno del Máster, con un 5+ en 1D6, regresa a la partida por el borde de la mesa.'],a:[['1','Carga Fantasmal','Carga si puedes; si ya estás en combate, ataca con normalidad. Si la carga tiene éxito, el objetivo recibe -1 a su Salvación hasta su siguiente turno.'],['2','Desgarro Helado','Ataca con sus garras espectrales. El objetivo sufre 1 Herida (F3). Si la herida no se salva, el objetivo pierde -1 a su Iniciativa hasta su siguiente turno.'],['3','Aullido Fantasmal','Todos los héroes hasta 4 casillas deben superar un chequeo de Liderazgo con -1. Si fallan, no podrán usar Acciones este turno.'],['4','Travesía Sombría','El Lobo Espectral se desliza entre las sombras. Muévete 12 casillas. Puede terminar su movimiento atravesando enemigos.'],['5','Presencia Heladora','Aura de miedo. Todos los héroes hasta 4 casillas deben superar un chequeo de Liderazgo con -1 o su movimiento se reduce a la mitad este turno, redondeando hacia abajo.'],['6','Furia Espectral','Ganas +1 Ataque y +1 Fuerza hasta el final del turno. Tus ataques ignoran coberturas y defensas especiales.']],loot:'1D6 + 1D4'},
'Lobo Pútrido':{sub:'Bestia · No Muertos · Unidad Básica',s:{M:7,HA:3,HP:2,F:4,R:3,H:1,I:4,A:1,L:2},save:'5+',eq:'Ninguna.',rules:['No sienten dolor. Inmunes a Psicología.','No muerto: cuando el señor que lo invocó muera, al comienzo de cada turno debe superar un chequeo de Liderazgo o sufrirá una herida sin salvación.'],a:[['1/2','Aullido putrefacto','Carga al enemigo más cercano, después ataca. Si ya estás en combate, ataca con normalidad.'],['3/4','Garrazos envenenados','Ataca si puedes y ganas 1 ataque extra. Si logran herir con un 6, niegas la tirada de salvación por armadura no mágica.'],['5/6','Embestida putrefacta','Tú y todos los Lobos Pútridos hasta 10 casillas ganáis +2 al Movimiento y +1 a la Fuerza, si pueden cargar este turno.']]},
'Vargulf':{sub:'Bestia Vampírica · No Muertos · Monstruo',s:{M:6,HA:5,HP:0,F:5,R:5,H:5,I:4,A:4,L:8},save:'5+ · Regeneración 6+',eq:'Garras y colmillos monstruosos.',rules:['Terror: provoca Terror.','Regeneración 6+: puede regenerar las heridas sufridas; los ataques de fuego anulan esta regeneración.','Furia Vampírica: cuando reduce a un héroe a 0 Heridas, recupera 1 Herida, hasta un máximo de 5.','Bestia desatada: nunca se retira voluntariamente y siempre intenta alcanzar al héroe más cercano.'],a:[['1/2','Caza implacable','Carga al héroe más cercano. Si ya está en combate, realiza sus ataques. Si consigue herir, el enemigo es desplazado hasta 3 casillas en dirección opuesta al Vargulf. Si durante el desplazamiento impacta contra un obstáculo o un aliado, ambos reciben un impacto de Fuerza 5.'],['3/4/5','Frenesí sangriento','Realiza sus ataques. Por cada herida que cause, realiza inmediatamente 1 ataque adicional contra el mismo objetivo. Los ataques adicionales no pueden generar nuevos ataques.'],['6','Masacre bestial','Realiza sus ataques contra todos los enemigos adyacentes. Obtiene +1 Ataque y +1 Fuerza durante esta acción. Después de resolver los ataques, todos los héroes que hayan sufrido al menos una herida deberán superar un chequeo de Liderazgo o retroceder 2 casillas.']]}}
;const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n];L.hidden=true;S.hidden=false;const stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>';const loot=d.loot?'<div class="enemy-note"><b>BOTÍN</b><p>'+d.loot+'</p></div>':'';C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2>'+n+'</h2><p class="hero-subtitle">'+d.sub+'</p>'+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><div class="enemy-note"><b>EQUIPO</b><p>'+d.eq+'</p></div><h3>REGLAS ESPECIALES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div><h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div>'+loot;scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
