<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · Bandidos</title><style>.enemy-list{display:grid;gap:8px}.enemy-list button{text-align:left}.actions article{padding:12px;margin:8px 0;background:#17110d;border-left:3px solid #7b2c20}.actions b{color:#d09a72}.back{margin-bottom:16px}.enemy-note{padding:12px;background:#15100c;border:1px solid #493723;line-height:1.5}.enemy-title{text-align:center}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">☠</div><p class="eyebrow">LA CRUZADA ETERNA</p><h1>BESTIARIO</h1><p class="motto">BANDIDOS</p></header><main><section id="list"><a href="bestiario.html?v=5" style="text-decoration:none"><button>← VOLVER A FACCIONES</button></a><p class="section-kicker">ARCHIVO DE ENEMIGOS</p><h2>Bandidos</h2><p>Salteadores del camino de Tannenbruch. Pulsa sobre un enemigo para abrir su ficha.</p><div class="enemy-list" id="buttons"></div></section><section id="sheet" hidden><button class="back" id="back">← VOLVER A BANDIDOS</button><div id="content"></div></section></main></div><script>const E={
'Bandido':{sub:'Salteador del camino de Tannenbruch',s:{M:4,HA:3,HP:3,F:3,R:3,H:1,I:3,A:1,L:6},save:'6+',eq:'Espada o garrote: Fuerza del portador.',rules:['Cobarde: si Rolf el Desollador muere, al comienzo de su turno el Bandido realiza un chequeo de Liderazgo. Si lo falla, intentará huir por la salida más cercana.'],a:[['1/2','¡A por ellos!','Carga contra el héroe más cercano. Si ya está en combate, realiza sus ataques normalmente.'],['3/4','Juego sucio','Si está en combate, realiza sus ataques y obtiene +1 al impactar si otro Bandido está adyacente al mismo héroe. Si no está en combate, avanza hacia el héroe más cercano.'],['5','Golpe bajo','Realiza sus ataques. Si consigue herir, el héroe sufre -1 HA hasta el final de su siguiente turno. Si no está en combate, carga si puede.'],['6','Emboscada','Todos los bandidos, incluido este, están a rango de carga, realizan una acción extra. Podrán moverse y atacar. Si ya están en combate, ganan 1 ataque extra.']],loot:'1D6 coronas. Registra el cadáver del Bandido. Máx. 60 coronas en total en esta misión.'},
'Bruto':{sub:'Matón de los salteadores del camino de Tannenbruch',s:{M:4,HA:3,HP:4,F:4,R:4,H:3,I:2,A:2,L:6},save:'5+',eq:'Garrote pesado: +1 Fuerza, Fuerza del portador. Armadura de cuero: Salvación 5+.',rules:['Imponente: los héroes que le ataquen cuerpo a cuerpo sufren -1 al impactar.','Violento: si el Bruto hiere a un héroe, este no puede retirarse ni usar acciones de huida hasta el final de su siguiente turno.'],a:[['1/2','Avance brutal','Carga contra el héroe más cercano. Si ya está en combate, realiza sus ataques normalmente.'],['3/4','Golpe demoledor','Realiza sus ataques. Si consigue herir, causa 1 herida adicional (sin tirada). Si no está en combate, avanza hacia el héroe más cercano.'],['5','Amenaza','Elige a un héroe visible hasta 6 casillas. Ese héroe debe superar un chequeo de Liderazgo. Si lo falla, no podrá usar acciones que no sean moverse o defenderse hasta el final de su siguiente turno.'],['6','Aplastar','Ataca si puedes, después realiza un único ataque con +1 al impactar y ganas golpe heroico.']],loot:'2D6 coronas. Si obtienes un 6 en 1D6, encuentras además un objeto de equipo común.'},
'Rolf el Desollador':{sub:'Jefe de los salteadores del camino de Tannenbruch',s:{M:5,HA:4,HP:3,F:4,R:4,H:3,I:4,A:2},save:'5+',eq:'Espada desolladora: +1 Fuerza, PA -1. Armadura de cuero reforzado: Salvación 5+.',rules:['Líder temido: mientras Rolf esté vivo, todos los bandidos a 6 casillas pueden repetir tiradas fallidas de Liderazgo.','Insensible al dolor: la primera vez que Rolf fuera a sufrir una herida, ignora esa herida.','Experto en desollar: si Rolf hiere a un héroe, ese héroe sufre -1 a todas sus salvaciones hasta el final de su siguiente turno.'],a:[['1/2','Embestida salvaje','Carga contra el héroe más cercano. Si ya está en combate, realiza sus ataques normalmente.'],['3/4','Tajo desollador','Realiza sus ataques. Si consigue herir, el héroe sufre -1 a su HA hasta el final de su siguiente turno. Si no está en combate, avanza hacia el héroe más cercano.'],['5','Intimidar','Rolf ruge amenazas. Elige un héroe visible hasta 6 casillas. Ese héroe debe superar un chequeo de Liderazgo. Si lo falla, no podrá realizar acciones que no sean moverse o retirarse en su siguiente turno. Después realiza tus ataques.'],['6','Aflicción aterradora','Rolf desata su furia. Todos los héroes visibles hasta 6 casillas deben superar un chequeo de Liderazgo. Si lo fallan, sufren -1 a todas sus tiradas (impactar, herir y salvaciones) hasta el final de su siguiente turno. Después realiza tus ataques.']],loot:'4D6 coronas. Además, si Rolf es derrotado, obtienes 1D3 objetos de equipo común robados a los viajantes del camino.'}
};const B=document.getElementById('buttons'),L=document.getElementById('list'),S=document.getElementById('sheet'),C=document.getElementById('content');Object.keys(E).forEach(n=>{const b=document.createElement('button');b.innerHTML='<b>'+n+'</b><small style="display:block;color:#9c8b72">'+E[n].sub+'</small>';b.onclick=()=>open(n);B.appendChild(b)});function open(n){const d=E[n],stats='<div class="stats-grid">'+Object.entries(d.s).map(([k,v])=>'<div><small>'+k+'</small><strong>'+v+'</strong></div>').join('')+'</div>';L.hidden=true;S.hidden=false;C.innerHTML='<p class="section-kicker">FICHA DE ENEMIGO</p><h2 class="enemy-title">'+n+'</h2><p class="hero-subtitle" style="text-align:center">'+d.sub+'</p>'+stats+'<p class="save-box">SALVACIÓN <b>'+d.save+'</b></p><div class="enemy-note"><b>EQUIPO</b><p>'+d.eq+'</p></div><h3>REGLAS ESPECIALES</h3><div class="abilities">'+d.rules.map(x=>'<article><p>'+x+'</p></article>').join('')+'</div><h3>ACCIONES · 1D6</h3><div class="actions">'+d.a.map(x=>'<article><b>'+x[0]+' · '+x[1]+'</b><p>'+x[2]+'</p></article>').join('')+'</div><div class="enemy-note"><b>BOTÍN</b><p>'+d.loot+'</p></div>';scrollTo(0,0)}document.getElementById('back').onclick=()=>{S.hidden=true;L.hidden=false;scrollTo(0,0)}</script></body></html>
