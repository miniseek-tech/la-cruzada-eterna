<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Bestiario · La Cruzada Eterna</title><style>body{background:#050505}.bestiary-shell{max-width:900px;margin:auto}.bestiary-intro{text-align:center;margin:8px auto 24px;max-width:680px;color:#b9aa91;line-height:1.55}.factions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.faction-card{display:block;text-decoration:none}.faction-card:last-child{grid-column:1/-1}.faction-card button{position:relative;width:100%;min-height:150px;margin:0;padding:24px 72px 22px 22px;text-align:left;overflow:hidden;border:1px solid #756247;background:radial-gradient(circle at 88% 30%,var(--glow),transparent 30%),linear-gradient(145deg,#211d18,#0b0b0a 72%);box-shadow:inset 0 0 0 3px #090807,inset 0 0 0 4px rgba(145,119,75,.22),0 5px 16px #000}.faction-card button:before{content:'';position:absolute;inset:7px;border:1px solid rgba(157,128,77,.22);pointer-events:none}.faction-card button:after{content:'◆';position:absolute;right:13px;bottom:10px;color:#88704c;font-size:.62rem}.faction-card strong{display:block;position:relative;z-index:2;color:#ead7b3;font:normal 1.32rem Georgia,serif;letter-spacing:1.4px}.faction-card small{display:block;position:relative;z-index:2;margin-top:9px;max-width:390px;color:#a99a82;font-size:.76rem;line-height:1.45}.faction-card .icon{position:absolute;z-index:1;right:23px;top:50%;transform:translateY(-50%);font-size:3.2rem;opacity:.82;filter:drop-shadow(0 4px 7px #000)}.faction-card .tag{display:inline-block;position:relative;z-index:2;margin-bottom:9px;color:#8f7b5b;font-size:.6rem;letter-spacing:2px}.undead{--glow:rgba(83,112,69,.42)}.druchii{--glow:rgba(91,49,126,.42)}.dawi-zharr{--glow:rgba(145,65,25,.45)}.beasts{--glow:rgba(83,91,49,.42)}.bandits{--glow:rgba(117,70,37,.42)}.back-link{text-decoration:none}.back-link bu ass="tag">CRIATURAS Y ABERRACIONES</span><span class="icon">🐾</span><strong>BESTIAS DEL CAOS</strong><small>Clakakr, Garra Pico y la temible Estatua Animada.</small></button></a><a class="faction-card bandits" href="bestiario-bandidos.html?v=1"><button><span class="tag">SALTEADORES DE TANNENBRUCH</span><span class="icon">🗡</span><strong>BANDIDOS</strong><small>Forajidos, mercenarios y Rolf el Desollador.</small></button></a></div></section></main></div></body></html>
