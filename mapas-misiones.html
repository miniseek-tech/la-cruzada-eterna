<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090706"><link rel="stylesheet" href="styles.css"><title>Mapas de Misión · La Cruzada Eterna</title><style>body{background:#090706;color:#ead8ad}.maps{max-width:980px;margin:auto}.map-note{padding:13px 14px;border:1px solid #554431;border-radius:8px;background:rgba(20,15,12,.78);color:#cdbb99;line-height:1.45}.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.map-card{position:relative;padding:0;overflow:hidden;border:1px solid #806d4f;border-radius:10px;background:linear-gradient(#201a13,#0b0a08);box-shadow:inset 0 0 18px #000,0 8px 18px rgba(0,0,0,.25);text-align:left;color:inherit;cursor:pointer;min-width:0}.map-card:active{transform:scale(.99)}.preview{position:relative;height:190px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#49351f,#0a0908 72%);border-bottom:1px solid #66513b}.preview img{width:100%;height:100%;object-fit:cover;display:block}.preview .status{position:absolute;right:9px;top:9px;padding:5px 8px;border:1px solid #725c3c;border-radius:999px;background:rgba(0,0,0,.72);font-size:.66rem;letter-spacing:1px;color:#d6c29b}.info{padding:14px}.info small{display:block;color:#9f8358;letter-spacing:1.4px;font-weight:700;margin-bottom:5px}.map-card h3{margin:0;color:#e2c58d;font-size:1.05rem;line-height:1.18}.map-card p{margin:7px 0 0;color:#b9aa91;font-size:.84rem;line-height:1.35}.viewer{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.96);display:none;flex-direction:column}.viewer.open{display:flex}.viewer-top{display:flex;align-items:center;gap:10px;padding:10px;background:#100d0a;border-bottom:1px solid #66513b}.viewer-title{flex:1;min-width:0}.viewer-title b{display:block;color:#e4c990;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.viewer-title small{color:#a88f68}.viewer button{border:1px solid #806d4f;background:#21180f;color:#ead8ad;border-radius:7px;padding:9px 12px;font-weight:700}.viewer-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;place-items:start center;padding:10px}.viewer-scroll img{display:block;max-width:none;height:auto}.zoom-controls{display:flex;gap:6px}.zoom-controls button{min-width:42px}@media(max-width:600px){.maps{padding:0 2px}.map-grid{grid-template-columns:1fr 1fr;gap:8px}.preview{height:132px}.info{padding:10px}.map-card h3{font-size:.9rem}.map-card p{font-size:.7rem}.info small{font-size:.62rem}.viewer-top{padding:8px}.viewer-title b{font-size:.82rem}.viewer-title small{font-size:.65rem}}</style></head><body><div id="app"><header class="hero-header"><div class="sigil">🗺</div><p class="eyebrow">ARCHIVO CARTOGRÁFICO</p><h1>MAPAS DE<br><span>MISIÓN</span></h1><div class="ornament">◆ ━━━━━ ✦ ━━━━━ ◆</div><p class="motto">CAMPOS DE BATALLA DE LA CRUZADA</p></header><main><section class="maps"><a href="./" style="text-decoration:none"><button>← VOLVER AL MENÚ</button></a><p class="section-kicker">CAMPAÑA PRINCIPAL</p><h2>Los 5 campos de batalla</h2><p class="map-note">Pulsa cualquier mapa para abrirlo a tamaño grande. Puedes desplazarte por él y usar los controles para ampliar o reducir durante la partida.</p><div class="map-grid" id="mapGrid"><button class="map-card" data-title="La Aldea de los Últimos Rezos" data-session="MISIÓN I" data-src="assets/file_00000000e71081f4bb9c6c1048e36613.png"><div class="preview"><img src="assets/file_00000000e71081f4bb9c6c1048e36613.png" alt="La Aldea de los Últimos Rezos"><span class="status">DISPONIBLE</span></div><div class="info"><small>MISIÓN I</small><h3>LA ALDEA DE LOS ÚLTIMOS REZOS</h3><p>Cementerio imperial, tumbas profanadas y ritual del Nigromante.</p></div></button><button class="map-card" data-title="El Puente de los Ahorcados" data-session="MISIÓN II" data-src="assets/file_00000000bea8821092d8caf0e7566341.png"><div class="preview"><img src="assets/file_00000000bea8821092d8caf0e7566341.png" alt="El Puente de los Ahorcados"><span class="status">DISPONIBLE</span></div><div class="info"><small>MISIÓN II</small><h3>EL PUENTE DE LOS AHORCADOS</h3><p>El paso mortal hacia Kappelburg.</p></div></button><button class="map-card" data-title="Los Patios de Kappelburg" data-session="MISIÓN III" data-src="assets/file_000000008eb48246a497a7bf8a22c90b.png"><div class="preview"><img src="assets/file_000000008eb48246a497a7bf8a22c90b.png" alt="Los Patios de Kappelburg"><span class="status">DISPONIBLE</span></div><div class="info"><small>MISIÓN III</small><h3>LOS PATIOS DE KAPPELBURG</h3><p>Patios en ruinas antes de descender a las criptas.</p></div></button><button class="map-card" data-title="Las Criptas de la Sangre Negra" data-session="MISIÓN IV" data-src="assets/file_000000003a8c81f4b073a22752f95c4b.png"><div class="preview"><img src="assets/file_000000003a8c81f4b073a22752f95c4b.png" alt="Las Criptas de la Sangre Negra"><span class="status">DISPONIBLE</span></div><div class="info"><small>MISIÓN IV</small><h3>LAS CRIPTAS DE LA SANGRE NEGRA</h3><p>Las profundidades malditas bajo Kappelburg.</p></div></button><button class="map-card" data-title="El Señor de Kappelburg" data-session="MISIÓN V · FINAL" data-src="assets/file_000000006b1c8210ad873fd463c4f9f2.png"><div class="preview"><img src="assets/file_000000006b1c8210ad873fd463c4f9f2.png" alt="El Señor de Kappelburg"><span class="status">DISPONIBLE</span></div><div class="info"><small>MISIÓN V · FINAL</small><h3>EL SEÑOR DE KAPPELBURG</h3><p>Catedral gótica en ruinas, altar del cáliz y batalla final.</p></div></button></div></section></main></div><div class="viewer" id="viewer" aria-hidden="true"><div class="viewer-top"><button id="closeViewer" aria-label="Cerrar">✕</button><div class="viewer-title"><b id="viewerName">Mapa</b><small id="viewerSession">MISIÓN</small></div><div class="zoom-controls"><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">+</button></div></div><div class="viewer-scroll" id="viewerScroll"><img id="viewerImg" alt=""></div></div><script>const viewer=document.getElementById('viewer'),img=document.getElementById('viewerImg'),nameEl=document.getElementById('viewerName'),sessionEl=document.getElementById('viewerSession'),scrollEl=document.getElementById('viewerScroll');let zoom=1;function applyZoom(){document.getElementById('zoomReset').textContent=Math.round(zoom*100)+'%';img.style.width=(img.naturalWidth*zoom)+'px'}document.querySelectorAll('.map-card').forEach(card=>card.addEventListener('click',()=>{nameEl.textContent=card.dataset.title;sessionEl.textContent=card.dataset.session;zoom=1;viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';img.src=card.dataset.src;img.alt=card.dataset.title;img.onload=()=>{applyZoom();scrollEl.scrollLeft=Math.max(0,(img.scrollWidth-scrollEl.clientWidth)/2)}}));function closeViewer(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');document.body.style.overflow='';img.removeAttribute('src')}document.getElementById('closeViewer').onclick=closeViewer;document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.25);applyZoom()};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.35,zoom-.25);applyZoom()};document.getElementById('zoomReset').onclick=()=>{zoom=1;applyZoom()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open'))closeViewer()});</script><script src="music-player.js?v=1"></script></body></html>
